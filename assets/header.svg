<svg fill="none" viewBox="0 0 900 160" width="100%" height="160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Minimalist Canvas Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Refined Name Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Ultra-subtle Top Accent Line -->
    <linearGradient id="topLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0F17" stop-opacity="0" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="160" rx="12" fill="url(#bgGrad)" />

  <!-- 1px Subtle Border -->
  <rect x="0.5" y="0.5" width="899" height="159" rx="11.5" fill="none" stroke="#1E293B" stroke-width="1" />

  <!-- Top Minimal Accent Line -->
  <rect x="120" y="1" width="660" height="2" fill="url(#topLine)" />

  <!-- Main Name Header -->
  <text x="450" y="78" text-anchor="middle" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="4">HAMID SHAHID</text>

  <!-- Subtitle -->
  <text x="450" y="114" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15" font-weight="500" letter-spacing="2">AI SYSTEMS ENGINEER <tspan fill="#38BDF8">/</tspan> CLOUD &amp; DEVOPS ARCHITECT</text>
</svg>
